<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>VISPAIR | Free 30‑Minute Tech Consultation</title>
  <meta name="description" content="Book a free 30‑minute consultation with VISPAIR to discuss your virtualization, IT, security, privacy, AI, or robotics challenge." />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.gstatic.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="icon" href="logo.png" />
  <!-- Drop this file (index.html) at the root of your repo (or docs/) then enable GitHub Pages. -->
  <style>
    :root {
      --brand: #007bff;
      --brand-dark: #0056b3;
      --text: #333;
      --bg: #f9fafb;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: 'Inter', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
    }
    .container {
      text-align: center;
      padding: 2rem 1rem;
      max-width: 480px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.06);
    }
    .logo {
      width: 120px;
      margin-bottom: 1rem;
    }
    h1 {
      font-size: 2rem;
      margin: 0.25rem 0;
      letter-spacing: 1px;
    }
    h2 {
      font-size: 1rem;
      font-weight: 400;
      color: #555;
      margin-bottom: 1.25rem;
    }
    .acronym {
      list-style: none;
      padding: 0;
      margin: 1rem 0 2rem;
      text-align: left;
    }
    .acronym li {
      margin: 0.35rem 0;
    }
    .acronym strong {
      width: 22px;
      display: inline-block;
    }
    .button {
      display: inline-block;
      background: var(--brand);
      color: #fff;
      padding: 0.9rem 1.8rem;
      font-weight: 600;
      border-radius: 6px;
      text-decoration: none;
      transition: background 0.3s ease;
    }
    .button:hover {
      background: var(--brand-dark);
    }
    .contact {
      margin-top: 1.75rem;
      font-size: 0.9rem;
      color: #666;
    }
    .contact a {
      color: var(--brand);
    }
    @media (max-width: 480px) {
      h1 {
        font-size: 1.75rem;
      }
      h2 {
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <img src="logo.png" alt="VISPAIR logo" class="logo" />
    <h1>VISPAIR</h1>
    <h2>Free 30‑Minute Consultation</h2>
    <ul class="acronym">
      <li><strong>V</strong>irtualization</li>
      <li><strong>I</strong>nformation Technology</li>
      <li><strong>S</strong>ecurity</li>
      <li><strong>P</strong>rivacy</li>
      <li><strong>A</strong>rtificial</li>
      <li><strong>I</strong>ntelligence</li>
      <li><strong>R</strong>obotics</li>
    </ul>
    <a
      href="https://calendar.app.google/fQCufju4WboSdQn67"
      class="button"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Schedule your free 30‑minute consultation via Google Calendar"
      >Schedule Free Consultation</a
    >
    <p class="contact">
      Can’t book? Email
      <a href="mailto:support@vispair.io">support@vispair.io</a>
    </p>
  </main>
</body>
</html>
