<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Interactive Waves - Light/Dark Mode</title>
  <style>
    /* Reset and Base Styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      height: 100%;
      font-family: sans-serif;
    }
    body {
      margin: 0;
      background-color: #ffffff;
      color: #000000;
      transition: background-color 0.3s, color 0.3s;
    }
    body.dark-mode {
      background-color: #222222;
      color: #ffffff;
    }

    /* Toggle Button */
    .toggle-btn {
      position: fixed;
      top: 15px;
      right: 15px;
      z-index: 9999;
      padding: 10px 16px;
      font-size: 14px;
      cursor: pointer;
      border: none;
      border-radius: 5px;
      background-color: #4CAF50;
      color: #ffffff;
      transition: background-color 0.3s;
    }
    .toggle-btn:hover {
      background-color: #ff4081;
    }

    /* Main Container */
    .container {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /* The Waves Canvas & Pointer Dot */
    .wave-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .wave-pointer {
      position: absolute;
      top: 0;
      left: 0;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      pointer-events: none;
      opacity: 0.2;
      background: #999999;
      transform: translate(-50%, -50%);
      will-change: transform;
    }

    /* Example Text Overlay */
    .content {
      position: absolute;
      z-index: 10;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      background-color: rgba(255, 255, 255, 0.7);
      color: #000;
      padding: 20px;
      border-radius: 8px;
      transition: background-color 0.3s, color 0.3s;
    }
    body.dark-mode .content {
      background-color: rgba(0, 0, 0, 0.5);
      color: #fff;
    }
  </style>
</head>
<body>
  <!-- Toggle Button for Dark/Light Mode -->
  <button class="toggle-btn" onclick="toggleDarkMode()">Toggle Dark Mode</button>

  <!-- Main Container with Waves -->
  <div class="container" id="waveContainer">
    <canvas id="waveCanvas" class="wave-canvas"></canvas>
    <div id="wavePointer" class="wave-pointer"></div>

    <!-- Example Content Over the Waves -->
    <div class="content">
      <h2>Interactive Waves</h2>
      <p>Move your mouse to interact with the waves.</p>
    </div>
  </div>

  <script>
    /*****************************************************************
     *  Light/Dark Mode Toggle
     *****************************************************************/
    function toggleDarkMode() {
      document.body.classList.toggle('dark-mode');
    }

    /*****************************************************************
     *  Grad and Noise Classes (ported from original code)
     *****************************************************************/
    class Grad {
      constructor(x, y, z) {
        this.x = x;
        this.y = y;
        this.z = z;
      }
      dot2(x, y) {
        return this.x * x + this.y * y;
      }
    }

    class Noise {
      constructor(seed = 0) {
        this.grad3 = [
          new Grad(1, 1, 0),   new Grad(-1, 1, 0),
          new Grad(1, -1, 0),  new Grad(-1, -1, 0),
          new Grad(1, 0, 1),   new Grad(-1, 0, 1),
          new Grad(1, 0, -1),  new Grad(-1, 0, -1),
          new Grad(0, 1, 1),   new Grad(0, -1, 1),
          new Grad(0, 1, -1),  new Grad(0, -1, -1),
        ];
        this.p = [
          151,160,137,91,90,15,131,13,201,95,96,53,194,233,7,225,
          140,36,103,30,69,142,8,99,37,240,21,10,23,190,6,148,247,
          120,234,75,0,26,197,62,94,252,219,203,117,35,11,32,57,
          177,33,88,237,149,56,87,174,20,125,136,171,168,68,175,
          74,165,71,134,139,48,27,166,77,146,158,231,83,111,229,
          122,60,211,133,230,220,105,92,41,55,46,245,40,244,102,
          143,54,65,25,63,161,1,216,80,73,209,76,132,187,208,89,
          18,169,200,196,135,130,116,188,159,86,164,100,109,198,
          173,186,3,64,52,217,226,250,124,123,5,202,38,147,118,
          126,255,82,85,212,207,206,59,227,47,16,58,17,182,189,28,
          42,223,183,170,213,119,248,152,2,44,154,163,70,221,153,
          101,155,167,43,172,9,129,22,39,253,19,98,108,110,79,113,
          224,232,178,185,112,104,218,246,97,228,251,34,242,193,
          238,210,144,12,191,179,162,241,81,51,145,235,249,14,239,
          107,49,192,214,31,181,199,106,157,184,84,204,176,115,
          121,50,45,127,4,150,254,138,236,205,93,222,114,67,29,24,
          72,243,141,128,195,78,66,215,61,156,180,
        ];
        this.perm = new Array(512);
        this.gradP = new Array(512);
        this.seed(seed);
      }

      seed(seed) {
        if (seed > 0 && seed < 1) seed *= 65536;
        seed = Math.floor(seed);
        if (seed < 256) seed |= seed << 8;
        for (let i = 0; i < 256; i++) {
          let v = (i & 1)
            ? this.p[i] ^ (seed & 255)
            : this.p[i] ^ ((seed >> 8) & 255);
          this.perm[i] = this.perm[i + 256] = v;
          this.gradP[i] = this.gradP[i + 256] = this.grad3[v % 12];
        }
      }

      fade(t) {
        return t * t * t * (t * (t * 6 - 15) + 10);
      }

      lerp(a, b, t) {
        return (1 - t) * a + t * b;
      }

      perlin2(x, y) {
        let X = Math.floor(x), Y = Math.floor(y);
        x -= X; y -= Y;
        X &= 255; Y &= 255;
        const n00 = this.gradP[X + this.perm[Y]].dot2(x, y);
        const n01 = this.gradP[X + this.perm[Y + 1]].dot2(x, y - 1);
        const n10 = this.gradP[X + 1 + this.perm[Y]].dot2(x - 1, y);
        const n11 = this.gradP[X + 1 + this.perm[Y + 1]].dot2(x - 1, y - 1);
        const u = this.fade(x);
        return this.lerp(
          this.lerp(n00, n10, u),
          this.lerp(n01, n11, u),
          this.fade(y)
        );
      }
    }

    /*****************************************************************
     *  Wave Logic in Plain JavaScript
     *****************************************************************/
    const waveSettings = {
      lineColor: "rgba(0, 0, 0, 0.3)",  // Default for light mode
      waveSpeedX: 0.0125,
      waveSpeedY: 0.005,
      waveAmpX: 32,
      waveAmpY: 16,
      xGap: 10,
      yGap: 32,
      friction: 0.925,
      tension: 0.005,
      maxCursorMove: 100,
    };

    let waveCanvas, waveCtx, wavePointer;
    let bounding = { width: 0, height: 0, left: 0, top: 0 };
    let noiseGen = new Noise(Math.random());
    let lines = [];
    let mouse = {
      x: -10, y: 0,
      lx: 0, ly: 0,
      sx: 0, sy: 0,
      v: 0, vs: 0,
      a: 0, set: false
    };

    function initWaves() {
      const container = document.getElementById("waveContainer");
      waveCanvas = document.getElementById("waveCanvas");
      wavePointer = document.getElementById("wavePointer");
      waveCtx = waveCanvas.getContext("2d");

      function setSize() {
        bounding = container.getBoundingClientRect();
        waveCanvas.width = bounding.width;
        waveCanvas.height = bounding.height;
      }

      function setLines() {
        const { width, height } = bounding;
        lines = [];
        const oWidth = width + 200, oHeight = height + 30;
        const totalLines = Math.ceil(oWidth / waveSettings.xGap);
        const totalPoints = Math.ceil(oHeight / waveSettings.yGap);
        const xStart = (width - waveSettings.xGap * totalLines) / 2;
        const yStart = (height - waveSettings.yGap * totalPoints) / 2;

        for (let i = 0; i <= totalLines; i++) {
          const pts = [];
          for (let j = 0; j <= totalPoints; j++) {
            pts.push({
              x: xStart + waveSettings.xGap * i,
              y: yStart + waveSettings.yGap * j,
              wave: { x: 0, y: 0 },
              cursor: { x: 0, y: 0, vx: 0, vy: 0 },
            });
          }
          lines.push(pts);
        }
      }

      function movePoints(time) {
        lines.forEach((pts) => {
          pts.forEach((p) => {
            const move = noiseGen.perlin2(
              (p.x + time * waveSettings.waveSpeedX) * 0.002,
              (p.y + time * waveSettings.waveSpeedY) * 0.0015
            ) * 12;
            p.wave.x = Math.cos(move) * waveSettings.waveAmpX;
            p.wave.y = Math.sin(move) * waveSettings.waveAmpY;

            const dx = p.x - mouse.sx, dy = p.y - mouse.sy;
            const dist = Math.hypot(dx, dy);
            const l = Math.max(175, mouse.vs);

            if (dist < l) {
              const s = 1 - dist / l;
              const f = Math.cos(dist * 0.001) * s;
              p.cursor.vx += Math.cos(mouse.a) * f * l * mouse.vs * 0.00065;
              p.cursor.vy += Math.sin(mouse.a) * f * l * mouse.vs * 0.00065;
            }

            p.cursor.vx += (0 - p.cursor.x) * waveSettings.tension;
            p.cursor.vy += (0 - p.cursor.y) * waveSettings.tension;
            p.cursor.vx *= waveSettings.friction;
            p.cursor.vy *= waveSettings.friction;
            p.cursor.x += p.cursor.vx * 2;
            p.cursor.y += p.cursor.vy * 2;

            // Limit cursor effect
            p.cursor.x = Math.min(waveSettings.maxCursorMove, Math.max(-waveSettings.maxCursorMove, p.cursor.x));
            p.cursor.y = Math.min(waveSettings.maxCursorMove, Math.max(-waveSettings.maxCursorMove, p.cursor.y));
          });
        });
      }

      function moved(p, withCursor = true) {
        const x = p.x + p.wave.x + (withCursor ? p.cursor.x : 0);
        const y = p.y + p.wave.y + (withCursor ? p.cursor.y : 0);
        return { x: Math.round(x * 10) / 10, y: Math.round(y * 10) / 10 };
      }

      function drawLines() {
        const { width, height } = bounding;
        waveCtx.clearRect(0, 0, width, height);

        // Decide wave line color based on dark mode or not
        waveSettings.lineColor = document.body.classList.contains("dark-mode")
          ? "rgba(255,255,255,0.3)"
          : "rgba(0,0,0,0.3)";

        waveCtx.beginPath();
        waveCtx.strokeStyle = waveSettings.lineColor;

        lines.forEach((points) => {
          let p1 = moved(points[0], false);
          waveCtx.moveTo(p1.x, p1.y);

          points.forEach((p, idx) => {
            const isLast = idx === points.length - 1;
            p1 = moved(p, !isLast);
            const p2 = moved(points[idx + 1] || points[points.length - 1], !isLast);
            waveCtx.lineTo(p1.x, p1.y);
            if (isLast) {
              waveCtx.moveTo(p2.x, p2.y);
            }
          });
        });
        waveCtx.stroke();
      }

      function tick(t) {
        mouse.sx += (mouse.x - mouse.sx) * 0.1;
        mouse.sy += (mouse.y - mouse.sy) * 0.1;

        const dx = mouse.x - mouse.lx, dy = mouse.y - mouse.ly;
        const d = Math.hypot(dx, dy);
        mouse.v = d;
        mouse.vs += (d - mouse.vs) * 0.1;
        mouse.vs = Math.min(100, mouse.vs);
        mouse.lx = mouse.x;
        mouse.ly = mouse.y;
        mouse.a = Math.atan2(dy, dx);

        // Move the small pointer dot
        wavePointer.style.transform = `translate(${mouse.x}px, ${mouse.y}px)`;

        movePoints(t);
        drawLines();
        requestAnimationFrame(tick);
      }

      function onResize() {
        setSize();
        setLines();
      }
      function onMouseMove(e) {
        updateMouse(e.pageX, e.pageY);
      }
      function onTouchMove(e) {
        e.preventDefault();
        const touch = e.touches[0];
        updateMouse(touch.clientX, touch.clientY);
      }
      function updateMouse(x, y) {
        mouse.x = x - bounding.left;
        mouse.y = y - bounding.top;
        if (!mouse.set) {
          mouse.sx = mouse.x;
          mouse.sy = mouse.y;
          mouse.lx = mouse.x;
          mouse.ly = mouse.y;
          mouse.set = true;
        }
      }

      setSize();
      setLines();
      requestAnimationFrame(tick);

      window.addEventListener("resize", onResize);
      window.addEventListener("mousemove", onMouseMove);
      window.addEventListener("touchmove", onTouchMove, { passive: false });
    }

    // Initialize the wave effect
    initWaves();
  </script>
</body>
</html>
